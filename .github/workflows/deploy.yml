name: Build y despliegue Bety-AI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Construir y desplegar
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jeremy28g/bety-ai:latest
            jeremy28g/bety-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en AWS
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ secrets.OLLAMA_TIMEOUT_SECONDS }}
          CHROMA_HOST: ${{ secrets.CHROMA_HOST }}
          CHROMA_PORT: ${{ secrets.CHROMA_PORT }}
          CHROMA_COLLECTION: ${{ secrets.CHROMA_COLLECTION }}
          DOCUMENT_FRAGMENTATION_MODE: ${{ secrets.DOCUMENT_FRAGMENTATION_MODE }}

        run: |
          set -e

          cd /home/ubuntu/Bety-AI

          git fetch origin
          git reset --hard origin/main

          umask 077

          {
            echo "OLLAMA_BASE_URL=${OLLAMA_BASE_URL}"
            echo "OLLAMA_MODEL=${OLLAMA_MODEL}"
            echo "OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS}"
            echo "CHROMA_HOST=${CHROMA_HOST}"
            echo "CHROMA_PORT=${CHROMA_PORT}"
            echo "CHROMA_COLLECTION=${CHROMA_COLLECTION}"
            echo ""
            echo "# Modes: pages - caracteres1200"
            echo "DOCUMENT_FRAGMENTATION_MODE=${DOCUMENT_FRAGMENTATION_MODE}"
          } > .env

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

          docker compose pull
          docker compose run --rm bety-ai python manage.py migrate
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps