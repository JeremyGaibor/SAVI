name: Build y despliegue SAVI

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    name: Construir y desplegar
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Crear repositorio SAVI en Docker Hub si no existe
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_REPOSITORY: savi
        run: |
          set -e

          repo_status="$(curl -sS -o /tmp/dockerhub_repo.json -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY}/")"

          if [ "$repo_status" = "200" ]; then
            echo "Repositorio Docker Hub ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY} ya existe."
            exit 0
          fi

          if [ "$repo_status" != "404" ]; then
            cat /tmp/dockerhub_repo.json
            exit 1
          fi

          login_status="$(curl -sS -o /tmp/dockerhub_login.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${DOCKERHUB_USERNAME}\",\"password\":\"${DOCKERHUB_TOKEN}\"}" \
            "https://hub.docker.com/v2/users/login/")"

          if [ "$login_status" != "200" ]; then
            cat /tmp/dockerhub_login.json
            exit 1
          fi

          dockerhub_jwt="$(python3 -c "import json; print(json.load(open('/tmp/dockerhub_login.json'))['token'])")"

          create_status="$(curl -sS -o /tmp/dockerhub_create.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: JWT ${dockerhub_jwt}" \
            -d "{\"namespace\":\"${DOCKERHUB_USERNAME}\",\"name\":\"${DOCKERHUB_REPOSITORY}\",\"description\":\"SAVI\",\"is_private\":true}" \
            "https://hub.docker.com/v2/repositories/")"

          if [ "$create_status" != "201" ] && [ "$create_status" != "200" ]; then
            create_status="$(curl -sS -o /tmp/dockerhub_create.json -w "%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${dockerhub_jwt}" \
              -d "{\"namespace\":\"${DOCKERHUB_USERNAME}\",\"name\":\"${DOCKERHUB_REPOSITORY}\",\"description\":\"SAVI\",\"is_private\":true}" \
              "https://hub.docker.com/v2/repositories/")"
          fi

          if [ "$create_status" != "201" ] && [ "$create_status" != "200" ]; then
            cat /tmp/dockerhub_create.json
            exit 1
          fi

          echo "Repositorio Docker Hub ${DOCKERHUB_USERNAME}/${DOCKERHUB_REPOSITORY} creado."

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jeremy28g/savi:latest
            jeremy28g/savi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en AWS
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_TIMEOUT_SECONDS: ${{ secrets.OLLAMA_TIMEOUT_SECONDS }}
          DEBUG: "False"
          ALLOWED_HOSTS: "16.58.71.138,bettyaiuteq.duckdns.org"
          CSRF_TRUSTED_ORIGINS: "https://16.58.71.138,https://bettyaiuteq.duckdns.org"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_FALLBACK_PROVIDER: ${{ secrets.LLM_FALLBACK_PROVIDER }}
          BEDROCK_MODEL_ID: ${{ secrets.BEDROCK_MODEL_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          BEDROCK_CONNECT_TIMEOUT_SECONDS: ${{ secrets.BEDROCK_CONNECT_TIMEOUT_SECONDS }}
          BEDROCK_READ_TIMEOUT_SECONDS: ${{ secrets.BEDROCK_READ_TIMEOUT_SECONDS }}
          CHROMA_HOST: ${{ secrets.CHROMA_HOST }}
          CHROMA_PORT: ${{ secrets.CHROMA_PORT }}
          CHROMA_COLLECTION: ${{ secrets.CHROMA_COLLECTION }}
          DOCUMENT_FRAGMENTATION_MODE: ${{ secrets.DOCUMENT_FRAGMENTATION_MODE }}
          SGA_API_TOKEN_URL: ${{ secrets.SGA_API_TOKEN_URL }}
          SGA_API_USUARIO_SESION_URL: ${{ secrets.SGA_API_USUARIO_SESION_URL }}
          SGA_API_TOKEN_FIJO: ${{ secrets.SGA_API_TOKEN_FIJO }}
          SGA_API_USUARIO: ${{ secrets.SGA_API_USUARIO }}
          SGA_API_PASSWORD: ${{ secrets.SGA_API_PASSWORD }}

        run: |
          set -e

          APP_DIR="/home/ubuntu/SAVI"
          OLD_APP_DIR="/home/ubuntu/Bety-AI"

          if [ ! -d "$APP_DIR" ] && [ -d "$OLD_APP_DIR" ]; then
            mv "$OLD_APP_DIR" "$APP_DIR"
          fi

          if [ ! -d "$APP_DIR" ]; then
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$APP_DIR"
          fi

          cd "$APP_DIR"

          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin
          git reset --hard origin/main

          umask 077

          {
            echo "OLLAMA_BASE_URL=${OLLAMA_BASE_URL}"
            echo "OLLAMA_MODEL=${OLLAMA_MODEL}"
            echo "OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS}"
            echo "DEBUG=${DEBUG}"
            echo "ALLOWED_HOSTS=${ALLOWED_HOSTS}"
            echo "CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}"
            echo "SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE}"
            echo "CSRF_COOKIE_SECURE=${CSRF_COOKIE_SECURE}"
            echo ""
            echo "# ollama | bedrock"
            echo "LLM_PROVIDER=${LLM_PROVIDER}"
            echo "# ollama | bedrock | vacio (sin fallback)"
            echo "LLM_FALLBACK_PROVIDER=${LLM_FALLBACK_PROVIDER}"
            echo "BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID}"
            echo "AWS_REGION=${AWS_REGION}"
            echo "BEDROCK_CONNECT_TIMEOUT_SECONDS=${BEDROCK_CONNECT_TIMEOUT_SECONDS}"
            echo "BEDROCK_READ_TIMEOUT_SECONDS=${BEDROCK_READ_TIMEOUT_SECONDS}"
            echo ""
            echo "CHROMA_HOST=${CHROMA_HOST}"
            echo "CHROMA_PORT=${CHROMA_PORT}"
            echo "CHROMA_COLLECTION=${CHROMA_COLLECTION}"
            echo ""
            echo "# Modes: pages - caracteres1200"
            echo "DOCUMENT_FRAGMENTATION_MODE=${DOCUMENT_FRAGMENTATION_MODE}"
            echo "SGA_API_TOKEN_URL=${SGA_API_TOKEN_URL}"
            echo "SGA_API_USUARIO_SESION_URL=${SGA_API_USUARIO_SESION_URL}"
            echo "SGA_API_TOKEN_FIJO=${SGA_API_TOKEN_FIJO}"
            echo "SGA_API_USUARIO=${SGA_API_USUARIO}"
            echo "SGA_API_PASSWORD=${SGA_API_PASSWORD}"
          } > .env

          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

          docker rm -f bety_ai_app bety_ai_chroma bety_ai_redis 2>/dev/null || true
          docker compose pull
          docker compose run --rm savi python manage.py migrate
          docker compose up -d --remove-orphans
          docker image prune -f
          docker compose ps
