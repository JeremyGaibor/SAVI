name: Build y despliegue Bety-AI

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Construir y desplegar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            jeremy28g/bety-ai:latest
            jeremy28g/bety-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configurar acceso SSH a AWS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Desplegar en AWS
        run: |
          ssh \
            -i ~/.ssh/ec2_key \
            -p "${{ secrets.EC2_PORT }}" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" << 'EOF'
              set -e

              cd /home/ubuntu/Bety-AI

              git fetch origin
              git reset --hard origin/main

              echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
                -u "${{ secrets.DOCKERHUB_USERNAME }}" \
                --password-stdin

              docker compose pull
              docker compose up -d --remove-orphans
              docker image prune -f
              docker compose ps
          EOF