<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bety IA</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        /* Burbuja para abrir el chatbot */
        #bety-chat-button {
            position: fixed;
            right: 10px;
            bottom: 10px;

            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: #1f8f4d;
            color: white;

            font-size: 28px;
            cursor: pointer;
            overflow: hidden;

            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.28);

            z-index: 9998;

            transition:
                transform 0.2s ease,
                background 0.2s ease;
        }

        #bety-chat-button:hover {
            background: #18753f;
            transform: scale(1.06);
        }

        #bety-chat-button img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Ventana principal del chatbot */
        #bety-chat-window {
            position: fixed;
            right: 10px;
            bottom: 10px;

            width: 380px;
            height: 520px;

            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 20px);

            display: none;
            flex-direction: column;

            overflow: hidden;

            border: 1px solid #d9d9d9;
            border-radius: 15px;

            background: white;

            box-shadow: 0 7px 26px rgba(0, 0, 0, 0.28);

            z-index: 9999;
        }

        #bety-chat-window.abierto {
            display: flex;
        }

        /* Encabezado */
        #bety-chat-header {
            min-height: 66px;
            padding: 11px 14px;

            display: flex;
            align-items: center;
            gap: 11px;

            background: #1f8f4d;
            color: white;
        }

        #bety-chat-avatar {
            width: 43px;
            height: 43px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;
            color: #1f8f4d;

            font-size: 22px;
            overflow: hidden;
        }

        #bety-chat-avatar img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        #bety-chat-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        #bety-chat-info strong {
            font-size: 16px;
        }

        #bety-chat-info small {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.88;
        }

        #bety-chat-close {
            margin-left: auto;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: transparent;
            color: white;

            font-size: 25px;
            cursor: pointer;

            transition: background 0.2s ease;
        }

        #bety-chat-close:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Área de mensajes */
        #bety-chat-messages {
            flex: 1;

            padding: 15px;

            overflow-y: auto;

            background: #f5f6fa;
        }

        .bety-message {
            width: fit-content;
            max-width: 86%;

            margin-bottom: 11px;
            padding: 10px 13px;

            border-radius: 14px;

            font-size: 14px;
            line-height: 1.45;

            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bety-message.bot {
            margin-right: auto;

            border: 1px solid #dddddd;
            border-bottom-left-radius: 4px;

            background: white;
            color: #242424;
        }

        .bety-message.user {
            margin-left: auto;

            border-bottom-right-radius: 4px;

            background: #1f8f4d;
            color: white;
        }

        .bety-message.loading {
            font-style: italic;
            opacity: 0.72;
        }

        .bety-message.error {
            border-color: #d85d5d;
            background: #fff1f1;
            color: #9f2929;
        }

        .bety-message.bot strong {
            font-weight: 700;
        }

        .bety-message.bot a {
            color: #1f8f4d;
            font-weight: 700;
            text-decoration: none;
        }

        .bety-message.bot a:hover {
            text-decoration: underline;
        }

        /* Fuentes */
        .bety-sources {
            width: fit-content;
            max-width: 86%;

            margin: -3px 0 12px;
            padding: 10px 12px;

            border: 1px solid #d9e7df;
            border-radius: 10px;

            background: #f9fffb;

            font-size: 12px;
        }

        .bety-sources-title {
            margin-bottom: 7px;

            color: #1f8f4d;
            font-weight: bold;
        }

        .bety-source {
            padding: 6px 0;

            border-top: 1px solid #e4e4e4;
        }

        .bety-source:first-of-type {
            border-top: none;
        }

        .bety-source a {
            color: #1f8f4d;
            font-weight: bold;
            text-decoration: none;
        }

        .bety-source a:hover {
            text-decoration: underline;
        }

        /* Área inferior */
        #bety-chat-input-area {
            display: flex;
            align-items: center;
            gap: 8px;

            padding: 11px;

            border-top: 1px solid #dddddd;

            background: white;
        }

        #bety-chat-input {
            flex: 1;
            min-width: 0;

            padding: 10px 13px;

            border: 1px solid #cccccc;
            border-radius: 20px;

            font-size: 14px;
            outline: none;
        }

        #bety-chat-input:focus {
            border-color: #1f8f4d;

            box-shadow: 0 0 0 2px rgba(31, 143, 77, 0.12);
        }

        #bety-chat-send {
            padding: 10px 16px;

            border: none;
            border-radius: 20px;

            background: #1f8f4d;
            color: white;

            font-weight: bold;
            cursor: pointer;

            transition: background 0.2s ease;
        }

        #bety-chat-send:hover {
            background: #18753f;
        }

        #bety-chat-input:disabled,
        #bety-chat-send:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        /* Adaptación para teléfonos */
        @media (max-width: 430px) {
            #bety-chat-button {
                right: 10px;
                bottom: 10px;
            }

            #bety-chat-window {
                right: 5px;
                bottom: 5px;

                width: calc(100vw - 10px);
                height: calc(100vh - 10px);

                max-width: none;
                max-height: none;

                border-radius: 12px;
            }
        }
    </style>
</head>

<body>

<!-- Token CSRF para las consultas -->
<form style="display: none;">
    {% csrf_token %}
</form>

<!-- Burbuja flotante -->
<button
    type="button"
    id="bety-chat-button"
    title="Abrir chat con Bety"
    aria-label="Abrir chat con Bety"
>
    <img src="{% static 'Bety_AI/img/bety.png' %}" alt="Bety IA">
</button>

<!-- Ventana del chatbot -->
<section
    id="bety-chat-window"
    aria-label="Chat de Bety IA"
>
    <header id="bety-chat-header">

        <div id="bety-chat-avatar">
            <img src="{% static 'Bety_AI/img/bety.png' %}" alt="">
        </div>

        <div id="bety-chat-info">
            <strong>Bety IA</strong>
            <small>Asistente documental</small>
        </div>

        <button
            type="button"
            id="bety-chat-close"
            aria-label="Cerrar chat"
            title="Cerrar chat"
        >
            ×
        </button>

    </header>

    <main id="bety-chat-messages">

        <div class="bety-message bot">
            Hola, soy Bety. Pregúntame sobre los documentos disponibles.
        </div>

    </main>

    <footer id="bety-chat-input-area">

        <input
            type="text"
            id="bety-chat-input"
            placeholder="Escribe tu pregunta..."
            autocomplete="off"
            maxlength="1500"
        >

        <button
            type="button"
            id="bety-chat-send"
        >
            Enviar
        </button>

    </footer>
</section>

<script>
    document.addEventListener(
        'DOMContentLoaded',
        function () {
            const chatButton = document.getElementById(
                'bety-chat-button'
            );

            const chatWindow = document.getElementById(
                'bety-chat-window'
            );

            const closeButton = document.getElementById(
                'bety-chat-close'
            );

            const input = document.getElementById(
                'bety-chat-input'
            );

            const sendButton = document.getElementById(
                'bety-chat-send'
            );

            const messages = document.getElementById(
                'bety-chat-messages'
            );

            const csrfInput = document.querySelector(
                '[name=csrfmiddlewaretoken]'
            );

            const csrfToken = csrfInput
                ? csrfInput.value
                : '';

            let enviando = false;
            let contextoSga = null;
            let conversationId = localStorage.getItem(
                'bety_conversation_id'
            );

            if (!conversationId) {
                conversationId = window.crypto && window.crypto.randomUUID
                    ? window.crypto.randomUUID()
                    : String(Date.now()) + String(Math.random()).slice(2);

                localStorage.setItem(
                    'bety_conversation_id',
                    conversationId
                );
            }

            const origenesPermitidosContexto = [
                'http://127.0.0.1:8002',
                'http://localhost:8002'
            ];

            window.addEventListener(
                'message',
                function (event) {
                    if (!origenesPermitidosContexto.includes(event.origin)) {
                        return;
                    }

                    if (
                        !event.data ||
                        event.data.tipo !== 'BETY_SGA_CONTEXT' ||
                        !event.data.usuario
                    ) {
                        return;
                    }

                    if (
                        typeof event.data.usuario === 'object' &&
                        !Array.isArray(event.data.usuario)
                    ) {
                        contextoSga = event.data.usuario;
                    }
                }
            );

            function avisarAlCliente(tipo) {
                if (window.parent === window) {
                    return;
                }

                window.parent.postMessage(
                    {
                        tipo: tipo
                    },
                    '*'
                );
            }

            function abrirChat() {
                chatWindow.classList.add(
                    'abierto'
                );

                chatButton.style.display = 'none';

                avisarAlCliente(
                    'BETY_CHAT_ABIERTO'
                );

                setTimeout(
                    function () {
                        input.focus();
                    },
                    100
                );
            }

            function cerrarChat() {
                chatWindow.classList.remove(
                    'abierto'
                );

                chatButton.style.display = 'flex';

                avisarAlCliente(
                    'BETY_CHAT_CERRADO'
                );
            }

            function escaparHtml(texto) {
                return String(texto || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function urlPermitida(url) {
                return /^https?:\/\//i.test(url);
            }

            function formatearMarkdownBasico(texto) {
                let html = escaparHtml(texto);

                html = html.replace(
                    /\[([^\]]+)]\((https?:\/\/[^\s)]+)\)/g,
                    function (_coincidencia, etiqueta, url) {
                        if (!urlPermitida(url)) {
                            return etiqueta;
                        }

                        return (
                            '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
                            etiqueta +
                            '</a>'
                        );
                    }
                );

                html = html.replace(
                    /\*\*([^*]+)\*\*/g,
                    '<strong>$1</strong>'
                );

                html = html.replace(
                    /\n/g,
                    '<br>'
                );

                return html;
            }

            function agregarMensaje(
                texto,
                remitente,
                claseExtra = ''
            ) {
                const mensaje = document.createElement(
                    'div'
                );

                mensaje.classList.add(
                    'bety-message',
                    remitente
                );

                if (claseExtra) {
                    mensaje.classList.add(
                        claseExtra
                    );
                }

                if (remitente === 'bot' && !claseExtra) {
                    mensaje.innerHTML = formatearMarkdownBasico(texto);
                } else {
                    mensaje.textContent = texto;
                }

                messages.appendChild(mensaje);
                messages.scrollTop = messages.scrollHeight;

                return mensaje;
            }

            function agregarFuentes(fuentes) {
                if (
                    !Array.isArray(fuentes) ||
                    fuentes.length === 0
                ) {
                    return;
                }

                const contenedor = document.createElement(
                    'div'
                );

                contenedor.classList.add(
                    'bety-sources'
                );

                const titulo = document.createElement(
                    'div'
                );

                titulo.classList.add(
                    'bety-sources-title'
                );

                titulo.textContent = 'Fuentes consultadas';

                contenedor.appendChild(titulo);

                const fuentesVistas = new Set();

                fuentes.forEach(
                    function (fuente, indice) {
                        const nombre =
                            fuente.titulo ||
                            fuente.nombre_archivo ||
                            `Documento ${indice + 1}`;

                        if (fuentesVistas.has(nombre)) {
                            return;
                        }

                        fuentesVistas.add(nombre);

                        const elemento = document.createElement(
                            'div'
                        );

                        elemento.classList.add(
                            'bety-source'
                        );

                        if (fuente.url) {
                            const enlace = document.createElement(
                                'a'
                            );

                            enlace.href = fuente.url;
                            enlace.target = '_blank';
                            enlace.rel = 'noopener noreferrer';
                            enlace.textContent = nombre;

                            elemento.appendChild(enlace);

                        } else {
                            const texto = document.createElement(
                                'span'
                            );

                            texto.textContent = nombre;

                            elemento.appendChild(texto);
                        }

                        if (fuente.pagina) {
                            elemento.append(
                                ` — página ${fuente.pagina}`
                            );
                        }

                        contenedor.appendChild(elemento);
                    }
                );

                messages.appendChild(contenedor);
                messages.scrollTop = messages.scrollHeight;
            }

            function cambiarEstado(estado) {
                enviando = estado;
                input.disabled = estado;
                sendButton.disabled = estado;
            }

            async function enviarPregunta() {
                if (enviando) {
                    return;
                }

                const pregunta = input.value.trim();

                if (!pregunta) {
                    return;
                }

                agregarMensaje(
                    pregunta,
                    'user'
                );

                input.value = '';

                const mensajeCargando = agregarMensaje(
                    'Buscando en los documentos...',
                    'bot',
                    'loading'
                );

                cambiarEstado(true);

                try {
                    const respuesta = await fetch(
                        "{% url 'api_consulta_ia' %}",
                        {
                            method: 'POST',
                            credentials: 'same-origin',

                            headers: {
                                'Content-Type':
                                    'application/json',

                                'X-CSRFToken':
                                    csrfToken
                            },

                            body: JSON.stringify({
                                pregunta: pregunta,
                                contexto_sga: contextoSga,
                                conversation_id: conversationId
                            })
                        }
                    );

                    let datos;

                    try {
                        datos = await respuesta.json();

                    } catch (errorJson) {
                        throw new Error(
                            'El servidor devolvió una respuesta no válida.'
                        );
                    }

                    mensajeCargando.remove();

                    if (!respuesta.ok || !datos.ok) {
                        agregarMensaje(
                            datos.respuesta ||
                            'No se pudo obtener una respuesta.',
                            'bot',
                            'error'
                        );

                        console.error(
                            datos.detalle || datos
                        );

                        return;
                    }

                    agregarMensaje(
                        datos.respuesta,
                        'bot'
                    );

                    agregarFuentes(
                        datos.fuentes || []
                    );

                } catch (error) {
                    mensajeCargando.remove();

                    agregarMensaje(
                        error.message ||
                        'No se pudo conectar con el servidor.',
                        'bot',
                        'error'
                    );

                    console.error(error);

                } finally {
                    cambiarEstado(false);
                    input.focus();
                }
            }

            chatButton.addEventListener(
                'click',
                abrirChat
            );

            closeButton.addEventListener(
                'click',
                cerrarChat
            );

            sendButton.addEventListener(
                'click',
                enviarPregunta
            );

            input.addEventListener(
                'keydown',
                function (event) {
                    if (
                        event.key === 'Enter' &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();
                        enviarPregunta();
                    }
                }
            );

            avisarAlCliente(
                'BETY_CHAT_CERRADO'
            );
        }
    );
</script>

</body>
</html>
