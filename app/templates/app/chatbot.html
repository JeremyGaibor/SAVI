<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SAVI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        /* Burbuja para abrir el chatbot */
        #app-chat-button {
            position: fixed;
            right: 10px;
            bottom: 10px;

            width: 62px;
            height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: linear-gradient(135deg, #22995a, #176b3a);
            color: white;

            font-size: 28px;
            cursor: pointer;
            overflow: hidden;

            box-shadow: 0 5px 16px rgba(0, 0, 0, 0.28);

            z-index: 9998;

            opacity: 1;
            visibility: visible;
            transform: scale(1);

            transition:
                transform 0.2s ease,
                filter 0.2s ease,
                opacity 0.18s ease,
                visibility 0s linear 0s;
        }

        #app-chat-button:hover {
            filter: brightness(1.08);
            transform: scale(1.06);
        }

        #app-chat-button.oculto {
            opacity: 0;
            visibility: hidden;
            transform: scale(0.5);
            pointer-events: none;

            transition:
                transform 0.18s ease,
                opacity 0.18s ease,
                visibility 0s linear 0.18s;
        }

        #app-chat-button img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Ventana principal del chatbot */
        #app-chat-window {
            position: fixed;
            right: 10px;
            bottom: 10px;

            width: 494px;
            height: 676px;

            max-width: calc(100vw - 20px);
            max-height: calc(100vh - 20px);

            display: flex;
            flex-direction: column;

            overflow: hidden;

            border: 1px solid #d9d9d9;
            border-radius: 18px;

            background: white;

            box-shadow: 0 7px 26px rgba(0, 0, 0, 0.28);

            z-index: 9999;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: scale(0.15) translateY(12px);
            transform-origin: bottom right;

            transition:
                transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.22s ease,
                visibility 0s linear 0.32s;
        }

        #app-chat-window.abierto {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: scale(1) translateY(0);

            transition:
                transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.22s ease,
                visibility 0s linear 0s;
        }

        @media (prefers-reduced-motion: reduce) {
            #app-chat-button,
            #app-chat-window,
            #app-chat-messages,
            #app-chat-greeting,
            #app-chat-input-area,
            .app-message,
            .app-sources {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
        }

        /* Cuerpo: mensajes + saludo inicial + entrada de texto */
        #app-chat-body {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;
        }

        #app-chat-body.app-vacio {
            justify-content: center;
        }

        /* Encabezado */
        #app-chat-header {
            min-height: 66px;
            padding: 11px 14px;

            display: flex;
            align-items: center;
            gap: 11px;

            background: linear-gradient(135deg, #22995a, #176b3a);
            color: white;
        }

        #app-chat-avatar {
            position: relative;

            width: 43px;
            height: 43px;

            flex-shrink: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: white;
            color: #1f8f4d;

            font-size: 22px;
            overflow: hidden;
        }

        #app-chat-avatar img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .app-status-dot {
            position: absolute;
            right: -1px;
            bottom: -1px;

            width: 11px;
            height: 11px;

            border-radius: 50%;
            border: 2px solid #1f8f4d;

            background: #3ddc72;

            animation: betyStatusPulse 2.4s infinite;
        }

        @keyframes betyStatusPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(61, 220, 114, 0.55);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(61, 220, 114, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(61, 220, 114, 0);
            }
        }

        #app-chat-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        #app-chat-info strong {
            font-size: 16px;
        }

        #app-chat-info small {
            font-size: 11px;
            font-weight: normal;
            opacity: 0.88;
        }

        #app-chat-voice,
        #app-chat-close {
            margin-left: auto;

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border: none;
            border-radius: 50%;

            background: transparent;
            color: white;

            font-size: 25px;
            cursor: pointer;

            transition: background 0.2s ease;
        }

        #app-chat-voice {
            margin-left: 0;

            font-size: 18px;
        }

        #app-chat-voice.activo {
            background: rgba(255, 255, 255, 0.22);
        }

        #app-chat-voice:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        #app-chat-voice:disabled:hover {
            background: transparent;
        }

        #app-chat-voice:hover,
        #app-chat-close:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        /* Área de mensajes */
        #app-chat-messages {
            flex: 1;
            min-height: 0;

            padding: 15px;

            overflow-y: auto;

            background: #f5f6fa;

            opacity: 1;
            visibility: visible;

            scrollbar-width: thin;
            scrollbar-color: #b9d9c6 transparent;

            transition: opacity 0.2s ease, visibility 0s linear 0s;
        }

        #app-chat-body.app-vacio #app-chat-messages {
            flex: 0 0 0;
            min-height: 0;
            padding: 0;

            opacity: 0;
            visibility: hidden;
            overflow: hidden;

            transition: opacity 0.15s ease, visibility 0s linear 0.15s;
        }

        /* Saludo centrado, visible solo cuando el chat aún no tiene mensajes */
        #app-chat-greeting {
            display: flex;
            flex-direction: column;
            align-items: center;

            margin: 0 22px 0;
            padding: 0;

            max-height: 0;
            opacity: 0;
            visibility: hidden;
            overflow: hidden;

            color: #1c3326;
            font-size: 20px;
            font-weight: 700;
            text-align: center;

            transition:
                opacity 0.15s ease,
                max-height 0.3s ease,
                margin 0.3s ease,
                visibility 0s linear 0.3s;
        }

        #app-chat-body.app-vacio #app-chat-greeting {
            max-height: 60px;
            opacity: 1;
            visibility: visible;
            margin: 0 22px 16px;

            transition:
                opacity 0.25s ease 0.05s,
                max-height 0.3s ease,
                margin 0.3s ease,
                visibility 0s linear 0s;
        }

        #app-chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        #app-chat-messages::-webkit-scrollbar-thumb {
            background: #b9d9c6;
            border-radius: 10px;
        }

        #app-chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        @keyframes betyMessageIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-message {
            width: fit-content;
            max-width: 86%;

            margin-bottom: 11px;
            padding: 10px 13px;

            border-radius: 14px;

            font-size: 14px;
            line-height: 1.45;

            white-space: pre-wrap;
            overflow-wrap: anywhere;

            animation: betyMessageIn 0.25s ease;
        }

        .app-message.bot {
            margin-right: auto;

            border: 1px solid #dddddd;
            border-bottom-left-radius: 4px;

            background: white;
            color: #242424;
        }

        .app-message.user {
            margin-left: auto;

            border-bottom-right-radius: 4px;

            background: #1f8f4d;
            color: white;
        }

        .app-message.loading {
            font-style: italic;
            opacity: 0.72;
        }

        .app-message.typing::after {
            content: '|';
            display: inline-block;
            margin-left: 2px;
            animation: betyTypingCursor 0.8s infinite;
        }

        @keyframes betyTypingCursor {
            0%,
            45% {
                opacity: 1;
            }

            46%,
            100% {
                opacity: 0;
            }
        }

        .app-message.error {
            border-color: #d85d5d;
            background: #fff1f1;
            color: #9f2929;
        }

        .app-message.bot strong {
            font-weight: 700;
        }

        .app-message.bot a {
            color: #1f8f4d;
            font-weight: 700;
            text-decoration: none;
        }

        .app-message.bot a:hover {
            text-decoration: underline;
        }

        .app-table-wrap {
            width: 100%;
            margin: 4px 0;
            overflow-x: auto;
        }

        .app-table {
            width: 100%;
            min-width: 280px;
            border-collapse: collapse;
            font-size: 13px;
            white-space: normal;
        }

        .app-table th,
        .app-table td {
            padding: 7px 8px;
            border: 1px solid #d7d7d7;
            text-align: left;
            vertical-align: top;
        }

        .app-table th {
            background: #eef7f2;
            color: #184f31;
            font-weight: 700;
        }

        .app-table tr:nth-child(even) td {
            background: #fafafa;
        }

        /* Fuentes */
        .app-sources {
            width: fit-content;
            max-width: 86%;

            margin: -3px 0 12px;
            padding: 10px 12px;

            border: 1px solid #d9e7df;
            border-radius: 10px;

            background: #f9fffb;

            font-size: 12px;

            animation: betyMessageIn 0.25s ease;
        }

        .app-sources-title {
            margin-bottom: 7px;

            color: #1f8f4d;
            font-weight: bold;
        }

        .app-source {
            padding: 6px 0;

            border-top: 1px solid #e4e4e4;
        }

        .app-source:first-of-type {
            border-top: none;
        }

        .app-source a {
            color: #1f8f4d;
            font-weight: bold;
            text-decoration: none;
        }

        .app-source a:hover {
            text-decoration: underline;
        }

        /* Área inferior */
        #app-chat-input-area {
            display: flex;
            align-items: flex-end;
            gap: 8px;

            margin: 0;
            padding: 11px;

            border-top: 1px solid #dddddd;
            border-radius: 0;

            background: white;
            box-shadow: none;

            transition:
                margin 0.3s ease,
                padding 0.3s ease,
                border-color 0.3s ease,
                border-radius 0.3s ease,
                box-shadow 0.3s ease,
                background 0.3s ease;
        }

        #app-chat-body.app-vacio #app-chat-input-area {
            margin: 0 18px;
            padding: 10px;

            border: 1px solid #e2e2e2;
            border-radius: 22px;

            background: #fafbfa;
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.08);
        }

        #app-chat-input {
            flex: 1;
            min-width: 0;
            height: 44px;
            min-height: 44px;
            max-height: 92px;

            padding: 10px 13px;

            border: 1px solid #cccccc;
            border-radius: 20px;

            font-size: 14px;
            line-height: 1.35;
            font-family: inherit;

            resize: none;
            overflow-y: hidden;

            outline: none;

            transition:
                border-radius 0.15s ease,
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        #app-chat-input:focus {
            border-color: #1f8f4d;

            box-shadow: 0 0 0 2px rgba(31, 143, 77, 0.12);
        }

        #app-chat-input::placeholder {
            color: #6c7370;
            opacity: 1;
        }

        #app-chat-send {
            flex-shrink: 0;

            padding: 10px 16px;

            border: none;
            border-radius: 20px;

            background: linear-gradient(135deg, #22995a, #176b3a);
            color: white;

            font-weight: bold;
            cursor: pointer;

            transition: filter 0.2s ease;
        }

        #app-chat-send:hover {
            filter: brightness(1.08);
        }

        #app-chat-input:disabled,
        #app-chat-send:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        /* Adaptación para teléfonos */
        @media (max-width: 430px) {
            #app-chat-button {
                right: 10px;
                bottom: 10px;
            }

            #app-chat-window {
                right: 5px;
                bottom: 5px;

                width: calc(100vw - 10px);
                height: calc(100vh - 10px);

                max-width: none;
                max-height: none;

                border-radius: 12px;
            }

            #app-chat-body.app-vacio #app-chat-input-area {
                margin: 0 14px;
                padding: 8px;
            }

            #app-chat-input {
                height: 42px;
                min-height: 42px;
                max-height: 84px;
            }
        }
    </style>
</head>

<body>

<!-- Token CSRF para las consultas -->
<form style="display: none;">
    {% csrf_token %}
</form>

<!-- Burbuja flotante -->
<button
    type="button"
    id="app-chat-button"
    title="Abrir chat con SAVI"
    aria-label="Abrir chat con SAVI"
>
    <img src="{% static 'app/img/app.png' %}" alt="SAVI">
</button>

<!-- Ventana del chatbot -->
<section
    id="app-chat-window"
    aria-label="Chat de SAVI"
    aria-hidden="true"
>
    <header id="app-chat-header">

        <div id="app-chat-avatar">
            <img src="{% static 'app/img/app.png' %}" alt="">
            <span class="app-status-dot" aria-hidden="true"></span>
        </div>

        <div id="app-chat-info">
            <strong>SAVI</strong>
            <small>Asistente documental</small>
        </div>

        <button
            type="button"
            id="app-chat-voice"
            aria-label="Activar lectura de respuestas"
            title="Activar lectura de respuestas"
        >
            🔇
        </button>

        <button
            type="button"
            id="app-chat-close"
            aria-label="Cerrar chat"
            title="Cerrar chat"
        >
            ×
        </button>

    </header>

    <div id="app-chat-body" class="app-vacio">

        <main id="app-chat-messages"></main>

        <div id="app-chat-greeting"></div>

        <footer id="app-chat-input-area">

            <textarea
                id="app-chat-input"
                placeholder="Escribe tu consulta"
                autocomplete="off"
                maxlength="1500"
                rows="1"
            ></textarea>

            <button
                type="button"
                id="app-chat-send"
            >
                Enviar
            </button>

        </footer>

    </div>
</section>

{{ contexto_sga|json_script:"app-sga-context" }}
{{ error_contexto_sga|json_script:"app-sga-error" }}

<script>
    document.addEventListener(
        'DOMContentLoaded',
        function () {
            const chatButton = document.getElementById(
                'app-chat-button'
            );

            const chatWindow = document.getElementById(
                'app-chat-window'
            );

            const closeButton = document.getElementById(
                'app-chat-close'
            );

            const voiceButton = document.getElementById(
                'app-chat-voice'
            );

            const input = document.getElementById(
                'app-chat-input'
            );

            const sendButton = document.getElementById(
                'app-chat-send'
            );

            const chatBody = document.getElementById(
                'app-chat-body'
            );

            const messages = document.getElementById(
                'app-chat-messages'
            );

            const greeting = document.getElementById(
                'app-chat-greeting'
            );

            const inputArea = document.getElementById(
                'app-chat-input-area'
            );

            const csrfInput = document.querySelector(
                '[name=csrfmiddlewaretoken]'
            );

            const csrfToken = csrfInput
                ? csrfInput.value
                : '';

            const contextoSgaInicial = leerJsonScript(
                'app-sga-context',
                null
            );

            const errorContextoSga = leerJsonScript(
                'app-sga-error',
                ''
            );

            let enviando = false;
            let contextoSga = (
                contextoSgaInicial &&
                typeof contextoSgaInicial === 'object' &&
                !Array.isArray(contextoSgaInicial)
            )
                ? contextoSgaInicial
                : null;
            let vozActiva = localStorage.getItem(
                'app_voice_enabled'
            ) === 'true';

            let conversationId = sessionStorage.getItem(
                'app_conversation_id'
            );

            if (!conversationId) {
                conversationId = window.crypto && window.crypto.randomUUID
                    ? window.crypto.randomUUID()
                    : String(Date.now()) + String(Math.random()).slice(2);

                sessionStorage.setItem(
                    'app_conversation_id',
                    conversationId
                );
            }

            const lectorVozDisponible = (
                'speechSynthesis' in window &&
                'SpeechSynthesisUtterance' in window
            );

            function leerJsonScript(id, valorPorDefecto) {
                const elemento = document.getElementById(id);

                if (!elemento) {
                    return valorPorDefecto;
                }

                try {
                    return JSON.parse(elemento.textContent);
                } catch (error) {
                    console.error(error);
                    return valorPorDefecto;
                }
            }

            const origenesPermitidosContexto = [
                'http://127.0.0.1:8002',
                'http://localhost:8002'
            ];

            window.addEventListener(
                'message',
                function (event) {
                    if (!origenesPermitidosContexto.includes(event.origin)) {
                        return;
                    }

                    if (
                        !event.data ||
                        event.data.tipo !== 'BETY_SGA_CONTEXT' ||
                        !event.data.usuario
                    ) {
                        return;
                    }

                    if (
                        typeof event.data.usuario === 'object' &&
                        !Array.isArray(event.data.usuario)
                    ) {
                        contextoSga = event.data.usuario;
                    }
                }
            );

            function obtenerSaludo() {
                const hora = new Date().getHours();

                if (hora >= 5 && hora < 12) {
                    return '🌅 Buenos días';
                }

                if (hora >= 12 && hora < 19) {
                    return '☀️ Buenas tardes';
                }

                return '🌙 Buenas noches';
            }

            function avisarAlCliente(tipo) {
                if (window.parent === window) {
                    return;
                }

                window.parent.postMessage(
                    {
                        tipo: tipo
                    },
                    '*'
                );
            }

            function actualizarBotonVoz() {
                if (!lectorVozDisponible) {
                    voiceButton.disabled = true;
                    voiceButton.textContent = '🔇';
                    voiceButton.title = 'Lectura de voz no disponible';
                    voiceButton.setAttribute(
                        'aria-label',
                        'Lectura de voz no disponible'
                    );
                    return;
                }

                voiceButton.classList.toggle(
                    'activo',
                    vozActiva
                );

                voiceButton.textContent = vozActiva
                    ? '🔊'
                    : '🔇';

                voiceButton.title = vozActiva
                    ? 'Desactivar lectura de respuestas'
                    : 'Activar lectura de respuestas';

                voiceButton.setAttribute(
                    'aria-label',
                    voiceButton.title
                );
            }

            function limpiarTextoParaVoz(texto) {
                return String(texto || '')
                    .replace(/\[([^\]]+)]\((https?:\/\/[^\s)]+)\)/g, '$1')
                    .replace(/\*\*([^*]+)\*\*/g, '$1')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function leerRespuesta(texto) {
                if (!lectorVozDisponible || !vozActiva) {
                    return;
                }

                const textoLimpio = limpiarTextoParaVoz(texto);

                if (!textoLimpio) {
                    return;
                }

                window.speechSynthesis.cancel();

                const lectura = new SpeechSynthesisUtterance(
                    textoLimpio
                );

                lectura.lang = 'es-ES';
                lectura.rate = 0.95;
                lectura.pitch = 1;

                window.speechSynthesis.speak(
                    lectura
                );
            }

            function alternarVoz() {
                if (!lectorVozDisponible) {
                    return;
                }

                vozActiva = !vozActiva;

                localStorage.setItem(
                    'app_voice_enabled',
                    String(vozActiva)
                );

                if (!vozActiva) {
                    window.speechSynthesis.cancel();
                }

                actualizarBotonVoz();
            }

            function abrirChat() {
                chatWindow.classList.add(
                    'abierto'
                );

                chatWindow.setAttribute(
                    'aria-hidden',
                    'false'
                );

                chatButton.classList.add(
                    'oculto'
                );

                avisarAlCliente(
                    'BETY_CHAT_ABIERTO'
                );

                setTimeout(
                    function () {
                        input.focus();
                    },
                    220
                );
            }

            function cerrarChat() {
                chatWindow.classList.remove(
                    'abierto'
                );

                chatWindow.setAttribute(
                    'aria-hidden',
                    'true'
                );

                if (lectorVozDisponible) {
                    window.speechSynthesis.cancel();
                }

                chatButton.classList.remove(
                    'oculto'
                );

                avisarAlCliente(
                    'BETY_CHAT_CERRADO'
                );
            }

            function pasarAModoChat() {
                if (!chatBody.classList.contains('app-vacio')) {
                    return;
                }

                const posicionAntes = inputArea.getBoundingClientRect();

                chatBody.classList.remove('app-vacio');
                input.placeholder = 'Escribe tu pregunta...';

                const posicionDespues = inputArea.getBoundingClientRect();
                const deltaY = posicionAntes.top - posicionDespues.top;

                if (!deltaY) {
                    return;
                }

                inputArea.style.transition = 'none';
                inputArea.style.transform = `translateY(${deltaY}px)`;

                requestAnimationFrame(
                    function () {
                        requestAnimationFrame(
                            function () {
                                inputArea.style.transition =
                                    'transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)';
                                inputArea.style.transform = 'translateY(0)';
                            }
                        );
                    }
                );

                inputArea.addEventListener(
                    'transitionend',
                    function limpiarTransicion(evento) {
                        if (evento.propertyName !== 'transform') {
                            return;
                        }

                        inputArea.style.transition = '';
                        inputArea.style.transform = '';
                        inputArea.removeEventListener(
                            'transitionend',
                            limpiarTransicion
                        );
                    }
                );
            }

            function escaparHtml(texto) {
                return String(texto || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            function urlPermitida(url) {
                return /^https?:\/\//i.test(url);
            }

            function esLineaTablaMarkdown(linea) {
                const texto = String(linea || '').trim();
                return texto.startsWith('|') && texto.endsWith('|');
            }

            function esSeparadorTablaMarkdown(linea) {
                const celdas = String(linea || '')
                    .trim()
                    .split('|')
                    .slice(1, -1);

                return (
                    celdas.length > 0 &&
                    celdas.every(
                        function (celda) {
                            return /^:?-{3,}:?$/.test(celda.trim());
                        }
                    )
                );
            }

            function dividirFilaTablaMarkdown(linea) {
                return String(linea || '')
                    .trim()
                    .split('|')
                    .slice(1, -1)
                    .map(
                        function (celda) {
                            return celda.trim();
                        }
                    );
            }

            function formatearMarkdownInlineSeguro(texto) {
                let html = escaparHtml(texto);

                html = html.replace(
                    /\[([^\]]+)]\((https?:\/\/[^\s)]+)\)/g,
                    function (_coincidencia, etiqueta, url) {
                        if (!urlPermitida(url)) {
                            return etiqueta;
                        }

                        return (
                            '<a href="' + url + '" target="_blank" rel="noopener noreferrer">' +
                            etiqueta +
                            '</a>'
                        );
                    }
                );

                html = html.replace(
                    /\*\*([^*]+)\*\*/g,
                    '<strong>$1</strong>'
                );

                return html;
            }

            function convertirTablaMarkdown(lineas) {
                const encabezados = dividirFilaTablaMarkdown(lineas[0]);
                const filas = lineas.slice(2).map(dividirFilaTablaMarkdown);

                let html = '<div class="app-table-wrap"><table class="app-table"><thead><tr>';

                encabezados.forEach(
                    function (encabezado) {
                        html += '<th>' + formatearMarkdownInlineSeguro(encabezado) + '</th>';
                    }
                );

                html += '</tr></thead><tbody>';

                filas.forEach(
                    function (fila) {
                        html += '<tr>';

                        encabezados.forEach(
                            function (_encabezado, indice) {
                                html += '<td>' + formatearMarkdownInlineSeguro(fila[indice] || '') + '</td>';
                            }
                        );

                        html += '</tr>';
                    }
                );

                html += '</tbody></table></div>';

                return html;
            }

            function formatearMarkdownBasico(texto) {
                const lineas = String(texto || '').split('\n');
                const partes = [];
                let indice = 0;

                while (indice < lineas.length) {
                    if (
                        indice + 1 < lineas.length &&
                        esLineaTablaMarkdown(lineas[indice]) &&
                        esSeparadorTablaMarkdown(lineas[indice + 1])
                    ) {
                        const tabla = [lineas[indice], lineas[indice + 1]];
                        indice += 2;

                        while (
                            indice < lineas.length &&
                            esLineaTablaMarkdown(lineas[indice])
                        ) {
                            tabla.push(lineas[indice]);
                            indice += 1;
                        }

                        partes.push(convertirTablaMarkdown(tabla));
                        continue;
                    }

                    const bloqueTexto = [];

                    while (
                        indice < lineas.length &&
                        !(
                            indice + 1 < lineas.length &&
                            esLineaTablaMarkdown(lineas[indice]) &&
                            esSeparadorTablaMarkdown(lineas[indice + 1])
                        )
                    ) {
                        bloqueTexto.push(lineas[indice]);
                        indice += 1;
                    }

                    partes.push(
                        formatearMarkdownInlineSeguro(
                            bloqueTexto.join('\n')
                        ).replace(/\n/g, '<br>')
                    );
                }

                return partes.join('<br>');
            }

            function agregarMensaje(
                texto,
                remitente,
                claseExtra = ''
            ) {
                const mensaje = document.createElement(
                    'div'
                );

                mensaje.classList.add(
                    'app-message',
                    remitente
                );

                if (claseExtra) {
                    mensaje.classList.add(
                        claseExtra
                    );
                }

                if (remitente === 'bot' && !claseExtra) {
                    mensaje.innerHTML = formatearMarkdownBasico(texto);
                } else {
                    mensaje.textContent = texto;
                }

                messages.appendChild(mensaje);
                desplazarSiCorresponde();

                return mensaje;
            }

            function esperar(ms) {
                return new Promise(
                    function (resolve) {
                        setTimeout(resolve, ms);
                    }
                );
            }

            function agregarTokenTexto(tokens, tipo, texto) {
                const partes = String(texto || '').split(/(\n)/);

                partes.forEach(
                    function (parte) {
                        if (!parte) {
                            return;
                        }

                        if (parte === '\n') {
                            tokens.push({
                                tipo: 'salto'
                            });
                            return;
                        }

                        tokens.push({
                            tipo: tipo,
                            texto: parte
                        });
                    }
                );
            }

            function dividirMarkdownParaEscritura(texto) {
                const tokens = [];
                const patronNegrita = /\*\*([^*]+)\*\*/g;
                let posicion = 0;
                let coincidencia;

                while ((coincidencia = patronNegrita.exec(texto)) !== null) {
                    agregarTokenTexto(
                        tokens,
                        'texto',
                        texto.slice(posicion, coincidencia.index)
                    );

                    agregarTokenTexto(
                        tokens,
                        'negrita',
                        coincidencia[1]
                    );

                    posicion = coincidencia.index + coincidencia[0].length;
                }

                agregarTokenTexto(
                    tokens,
                    'texto',
                    texto.slice(posicion)
                );

                return tokens;
            }

            async function escribirTextoEnElemento(elemento, texto) {
                const partes = String(texto || '').match(/\S+\s*/g) || [texto];

                for (const parte of partes) {
                    elemento.appendChild(
                        document.createTextNode(parte)
                    );

                    desplazarSiCorresponde();

                    await esperar(
                        parte.length > 12 ? 70 : 45
                    );
                }
            }

            async function agregarMensajeEscribiendo(texto) {
                const contenido = String(texto || '');

                const mensaje = document.createElement(
                    'div'
                );

                mensaje.classList.add(
                    'app-message',
                    'bot',
                    'typing'
                );

                messages.appendChild(mensaje);

                if (
                    window.matchMedia &&
                    window.matchMedia(
                        '(prefers-reduced-motion: reduce)'
                    ).matches
                ) {
                    mensaje.classList.remove('typing');
                    mensaje.innerHTML = formatearMarkdownBasico(contenido);
                    desplazarSiCorresponde();
                    return mensaje;
                }

                const tokens = dividirMarkdownParaEscritura(contenido);

                for (const token of tokens) {
                    if (token.tipo === 'salto') {
                        mensaje.appendChild(
                            document.createElement('br')
                        );

                        desplazarSiCorresponde();
                        continue;
                    }

                    if (token.tipo === 'negrita') {
                        const negrita = document.createElement('strong');
                        mensaje.appendChild(negrita);

                        await escribirTextoEnElemento(
                            negrita,
                            token.texto
                        );

                        continue;
                    }

                    await escribirTextoEnElemento(
                        mensaje,
                        token.texto
                    );
                }

                mensaje.classList.remove('typing');
                mensaje.innerHTML = formatearMarkdownBasico(contenido);
                desplazarSiCorresponde();

                return mensaje;
            }

            function agregarFuentes(fuentes) {
                if (
                    !Array.isArray(fuentes) ||
                    fuentes.length === 0
                ) {
                    return;
                }

                const contenedor = document.createElement(
                    'div'
                );

                contenedor.classList.add(
                    'app-sources'
                );

                const titulo = document.createElement(
                    'div'
                );

                titulo.classList.add(
                    'app-sources-title'
                );

                titulo.textContent = 'Fuentes consultadas';

                contenedor.appendChild(titulo);

                const fuentesVistas = new Set();

                fuentes.forEach(
                    function (fuente, indice) {
                        const nombre =
                            fuente.titulo ||
                            fuente.nombre_archivo ||
                            `Documento ${indice + 1}`;

                        if (fuentesVistas.has(nombre)) {
                            return;
                        }

                        fuentesVistas.add(nombre);

                        const elemento = document.createElement(
                            'div'
                        );

                        elemento.classList.add(
                            'app-source'
                        );

                        if (fuente.url) {
                            const enlace = document.createElement(
                                'a'
                            );

                            enlace.href = fuente.url;
                            enlace.target = '_blank';
                            enlace.rel = 'noopener noreferrer';
                            enlace.textContent = nombre;

                            elemento.appendChild(enlace);

                        } else {
                            const texto = document.createElement(
                                'span'
                            );

                            texto.textContent = nombre;

                            elemento.appendChild(texto);
                        }

                        if (fuente.pagina) {
                            elemento.append(
                                ` — página ${fuente.pagina}`
                            );
                        }

                        contenedor.appendChild(elemento);
                    }
                );

                messages.appendChild(contenedor);
                desplazarSiCorresponde();
            }

            const TOLERANCIA_FONDO_EXACTO = 4;

            let usuarioSubio = false;
            let ultimoScrollTop = messages.scrollTop;
            let ignorarProximoEventoScroll = false;

            function estaEnElFondo() {
                return (
                    messages.scrollHeight -
                    messages.scrollTop -
                    messages.clientHeight
                ) <= TOLERANCIA_FONDO_EXACTO;
            }

            function desplazarAlFondo() {
                ignorarProximoEventoScroll = true;
                messages.scrollTop = messages.scrollHeight;
                ultimoScrollTop = messages.scrollTop;
            }

            function desplazarSiCorresponde() {
                if (!usuarioSubio) {
                    desplazarAlFondo();
                }
            }

            messages.addEventListener(
                'scroll',
                function () {
                    if (ignorarProximoEventoScroll) {
                        ignorarProximoEventoScroll = false;
                        ultimoScrollTop = messages.scrollTop;
                        return;
                    }

                    const scrollTopActual = messages.scrollTop;

                    if (scrollTopActual < ultimoScrollTop - 1) {
                        usuarioSubio = true;
                    } else if (estaEnElFondo()) {
                        usuarioSubio = false;
                    }

                    ultimoScrollTop = scrollTopActual;
                }
            );

            function cambiarEstado(estado) {
                enviando = estado;
                input.disabled = estado;
                sendButton.disabled = estado;
            }

            const INPUT_FONT_MAX = 14;
            const INPUT_FONT_MIN = 12;
            const INPUT_EMPTY_HEIGHT = 44;
            const INPUT_MAX_HEIGHT = 92;
            const INPUT_LINE_HEIGHT_RATIO = 1.35;

            function ajustarInput() {
                if (!input.value.trim()) {
                    input.style.fontSize = INPUT_FONT_MAX + 'px';
                    input.style.height = INPUT_EMPTY_HEIGHT + 'px';
                    input.style.overflowY = 'hidden';
                    input.style.borderRadius = '20px';
                    return;
                }

                input.style.fontSize = INPUT_FONT_MAX + 'px';
                input.style.height = 'auto';

                const alturaLineaMax = INPUT_FONT_MAX * INPUT_LINE_HEIGHT_RATIO;

                const lineas = Math.max(
                    1,
                    Math.round(input.scrollHeight / alturaLineaMax)
                );

                const tamano = Math.max(
                    INPUT_FONT_MIN,
                    INPUT_FONT_MAX - Math.max(0, lineas - 3)
                );

                if (tamano !== INPUT_FONT_MAX) {
                    input.style.fontSize = tamano + 'px';
                    input.style.height = 'auto';
                }

                const alturaDeseada = Math.min(
                    input.scrollHeight,
                    INPUT_MAX_HEIGHT
                );

                input.style.height = alturaDeseada + 'px';

                input.style.overflowY =
                    input.scrollHeight > INPUT_MAX_HEIGHT
                        ? 'auto'
                        : 'hidden';

                input.style.borderRadius =
                    alturaDeseada > 44
                        ? '16px'
                        : '20px';
            }

            async function enviarPregunta() {
                if (enviando) {
                    return;
                }

                const pregunta = input.value.trim();

                if (!pregunta) {
                    return;
                }

                pasarAModoChat();

                usuarioSubio = false;

                agregarMensaje(
                    pregunta,
                    'user'
                );

                input.value = '';
                ajustarInput();

                const mensajesCarga = [
                    'Procesando...',
                    'En proceso...',
                    'Trabajando...',
                    'En curso...',
                    'Cargando...',
                    'Un momento...',
                    'Un instante...'
                ];

                let indiceCarga = 0;

                const mensajeCargando = agregarMensaje(
                    mensajesCarga[indiceCarga],
                    'bot',
                    'loading'
                );

                const intervaloCarga = setInterval(
                    function () {
                        indiceCarga = (
                            indiceCarga + 1
                        ) % mensajesCarga.length;

                        mensajeCargando.textContent =
                            mensajesCarga[indiceCarga];

                        desplazarSiCorresponde();
                    },
                    1400
                );

                function detenerCarga() {
                    clearInterval(intervaloCarga);

                    if (mensajeCargando.parentNode) {
                        mensajeCargando.remove();
                    }
                }

                cambiarEstado(true);

                try {
                    const respuesta = await fetch(
                        "{% url 'api_consulta_ia' %}",
                        {
                            method: 'POST',
                            credentials: 'same-origin',

                            headers: {
                                'Content-Type':
                                    'application/json',

                                'X-CSRFToken':
                                    csrfToken
                            },

                            body: JSON.stringify({
                                pregunta: pregunta,
                                contexto_sga: contextoSga,
                                conversation_id: conversationId
                            })
                        }
                    );

                    let datos;

                    try {
                        datos = await respuesta.json();

                    } catch (errorJson) {
                        throw new Error(
                            'El servidor devolvió una respuesta no válida.'
                        );
                    }

                    detenerCarga();

                    if (!respuesta.ok || !datos.ok) {
                        agregarMensaje(
                            datos.respuesta ||
                            'No se pudo obtener una respuesta.',
                            'bot',
                            'error'
                        );

                        console.error(
                            datos.detalle || datos
                        );

                        return;
                    }

                    await agregarMensajeEscribiendo(
                        datos.respuesta
                    );

                    leerRespuesta(
                        datos.respuesta
                    );

                    agregarFuentes(
                        datos.fuentes || []
                    );

                } catch (error) {
                    detenerCarga();

                    agregarMensaje(
                        error.message ||
                        'No se pudo conectar con el servidor.',
                        'bot',
                        'error'
                    );

                    console.error(error);

                } finally {
                    cambiarEstado(false);
                    input.focus();
                }
            }

            chatButton.addEventListener(
                'click',
                abrirChat
            );

            closeButton.addEventListener(
                'click',
                cerrarChat
            );

            voiceButton.addEventListener(
                'click',
                alternarVoz
            );

            sendButton.addEventListener(
                'click',
                enviarPregunta
            );

            input.addEventListener(
                'keydown',
                function (event) {
                    if (
                        event.key === 'Enter' &&
                        !event.shiftKey
                    ) {
                        event.preventDefault();
                        enviarPregunta();
                    }
                }
            );

            input.addEventListener(
                'input',
                ajustarInput
            );

            avisarAlCliente(
                'BETY_CHAT_CERRADO'
            );

            greeting.textContent = obtenerSaludo();

            if (errorContextoSga) {
                pasarAModoChat();
                agregarMensaje(
                    errorContextoSga,
                    'bot',
                    'error'
                );
            }

            actualizarBotonVoz();
            ajustarInput();
        }
    );
</script>
