services:
  bety-ai:
    image: jeremy28g/bety-ai:latest
    container_name: bety_ai_app
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_PATH: /app/data/db.sqlite3
      REDIS_URL: redis://redis:6379/0

    volumes:
      - sqlite_data:/app/data

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - chromadb
      - redis

  chromadb:
    image: chromadb/chroma:latest
    container_name: bety_ai_chroma
    restart: unless-stopped

    expose:
      - "8000"

    volumes:
      - chroma_data:/chroma/chroma

  redis:
    image: redis:7-alpine
    container_name: bety_ai_redis
    restart: unless-stopped

    expose:
      - "6379"

volumes:
  chroma_data:
  sqlite_data:
