services:
  bety-ai:
    image: jeremy28g/bety-ai:latest
    container_name: bety_ai_app
    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:latest
    container_name: bety_ai_chroma
    restart: unless-stopped

    expose:
      - "8000"

    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data: